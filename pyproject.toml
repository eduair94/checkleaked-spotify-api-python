[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkleaked-spotify-api"
version = "2.1.0"
description = "Typed Python SDK for the CheckLeaked Spotify Data API and RapidAPI spotify81."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Eduardo Airaudo", email = "airaudoeduardo@gmail.com" }]
keywords = [
    "spotify",
    "spotify-api",
    "spotify-data",
    "spotify81",
    "rapidapi",
    "checkleaked",
    "music",
    "lyrics",
    "charts",
    "concerts",
    "sdk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "mypy>=1.8",
    "types-requests",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://spotify.checkleaked.cc"
Documentation = "https://spotify-proxy.checkleaked.cc/docs"
Repository = "https://github.com/eduair94/checkleaked-spotify-api-python"
Issues = "https://github.com/eduair94/checkleaked-spotify-api-python/issues"
OpenAPI = "https://spotify-proxy.checkleaked.cc/openapi.json"
Status = "https://spotify.checkleaked.cc/status"
Changelog = "https://github.com/eduair94/checkleaked-spotify-api-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_api_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "scripts",
    "README.md",
    "API_REFERENCE.md",
    "LICENSE",
    "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: performs a real network request against a configured provider",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = false
files = ["src"]
